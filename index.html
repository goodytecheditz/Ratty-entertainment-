<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ratty Entertainment | Official Comedy Hub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #06080c; --card-bg: #111622; --accent-orange: #ff5e00; --text-main: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }
        
        nav { padding: 20px 8%; display: flex; justify-content: space-between; background: #06080c; }
        .brand-logo { font-family: 'Montserrat', sans-serif; font-weight: 900; color: #fff; text-decoration: none; }
        .hero { text-align: center; padding: 60px 20px; }
        .btn-yt { background: #ff0000; color: white; padding: 12px 25px; border-radius: 8px; text-decoration: none; font-weight: 600; display: inline-block; margin-top: 20px; }
        
        .section-header { text-align: center; margin: 40px 0 20px 0; font-family: 'Montserrat', sans-serif; }
        .crew-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 0 8%; max-width: 1000px; margin: 0 auto; }
        .crew-card { background: var(--card-bg); padding: 15px; border-radius: 15px; text-align: center; }
        .crew-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 10px; }
        
        .contact-box { max-width: 500px; margin: 50px auto; background: var(--card-bg); padding: 30px; border-radius: 20px; }
        .form-control { width: 100%; padding: 12px; margin: 10px 0; background: #06080c; border: 1px solid #333; color: #fff; border-radius: 8px; }
        .btn-submit { width: 100%; padding: 15px; background: #25d366; border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; }
        footer { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="brand-logo">RATTY ENTERTAINMENT</a>
    </nav>

    <div class="hero">
        <h1>Unstoppable Laughter</h1>
        <p>Catch our latest skits on YouTube</p>
        <a href="https://youtube.com/@comedianratty1?si=V9VU2n94kbfGBL7O" target="_blank" class="btn-yt">
            <i class="fa-brands fa-youtube"></i> Subscribe on YouTube
        </a>
    </div>

    <h2 class="section-header">Meet The Crew</h2>
    <section class="crew-grid">
        <div class="crew-card">
            <img src="https://i.ibb.co/C3DjCw5f/IMG-20260529-WA0070.jpg" class="crew-img">
            <h3>Ratty</h3>
            <p>CEO & Founder</p>
        </div>
        <div class="crew-card">
            <img src="https://i.ibb.co/LhRQzPMt/IMG-20260529-WA0089.jpg" class="crew-img">
            <h3>She's Crazy</h3>
            <p>Comedian</p>
        </div>
    </section>

    <div class="contact-box">
        <form id="bookingForm">
            <input type="text" id="name" class="form-control" placeholder="Your Name" required>
            <input type="text" id="type" class="form-control" placeholder="Event Type" required>
            <textarea id="msg" class="form-control" placeholder="Details"></textarea>
            <button type="submit" class="btn-submit">Chat with Management</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Ratty Entertainment</p>
    </footer>

    <script>
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const n = document.getElementById('name').value;
            const t = document.getElementById('type').value;
            const m = document.getElementById('msg').value;
            window.open(`https://wa.me/2348136045102?text=Booking from ${n}. Project: ${t}. Details: ${m}`, '_blank');
        });
    </script>
</body>
</html>
